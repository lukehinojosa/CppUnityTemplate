name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_PROJECT: Unity

jobs:
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run
        run: ./build/CppUnityTemplate

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CppUnityTemplate-${{ runner.os }}
          path: |
            build/CppUnityTemplate
            build/CppUnityTemplate.exe
          retention-days: 7

  # Unity needs a license. Add UNITY_LICENSE (Personal, contents of the .ulf file) or UNITY_SERIAL,
  # plus UNITY_EMAIL and UNITY_PASSWORD, as repository secrets. Without them the Unity jobs are skipped.
  unity-license:
    name: Check Unity license
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No UNITY_LICENSE or UNITY_SERIAL secret; skipping the Unity build."
          fi

  # WebGL player using the WebGPU graphics API (set in Unity/ProjectSettings/ProjectSettings.asset).
  webgl:
    name: Unity WebGPU build
    needs: unity-license
    if: needs.unity-license.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT }}/Library
          key: Library-WebGL-${{ hashFiles(format('{0}/Assets/**', env.UNITY_PROJECT), format('{0}/Packages/**', env.UNITY_PROJECT), format('{0}/ProjectSettings/**', env.UNITY_PROJECT)) }}
          restore-keys: Library-WebGL-

      - name: Build player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.UNITY_PROJECT }}
          targetPlatform: WebGL
          buildName: WebGL

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  # Publishes pushes to the default branch. Repo Settings > Pages > Source must be "GitHub Actions".
  deploy:
    name: Deploy to GitHub Pages
    needs: webgl
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
